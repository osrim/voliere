      .voliere-tile-trim { fill: #3c3a32; }
      .voliere-tile-stand-detail { stroke: #898575; }
      .voliere-tile-motion { stroke: #a4bea8; }
    }
  
    .voliere-tile-background { fill: #f4f6f3; }
